<div class="wrapper" [ngClass]="{ 'sidebar-open': isSidebarOpen }">
  <div class="dashboard-container">
    <div class="stats-container">
      <div class="stats-box" *ngFor="let data of StatsCards">
        <p class="stats-number">{{ data.count }}</p>
        <p class="stats-text">{{ data.label }}</p>
      </div>
    </div>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="laptops" class="mat-elevation-z8">

      <!-- Assigned Personnel Column -->
      <ng-container matColumnDef="employeeName">
        <th mat-header-cell *matHeaderCellDef>Employee Name</th>
        <td mat-cell *matCellDef="let employee">
          {{ employee.employeeName }}
        </td>
      </ng-container>

      <!-- Purchase Date Column -->
      <ng-container matColumnDef="purchaseDate">
        <th mat-header-cell *matHeaderCellDef>Purchase Date</th>
        <td mat-cell *matCellDef="let laptop">{{ laptop.purchaseDate | date }}</td>
      </ng-container>

      <ng-container matColumnDef="laptopAge">
        <th mat-header-cell *matHeaderCellDef>LaptopAge</th>
        <td mat-cell *matCellDef="let laptop">
          {{ laptop.laptopAge }}
        </td>
      </ng-container>

      <!-- Condition Column -->
      <ng-container matColumnDef="condition">
        <th mat-header-cell *matHeaderCellDef>Condition</th>
        <td mat-cell *matCellDef="let laptop">{{ laptop.condition }}</td>
      </ng-container>

      <!-- Laptop Granted Column -->
      <ng-container matColumnDef="laptopsGranted">
        <th mat-header-cell *matHeaderCellDef>Laptops Granted</th>
        <td mat-cell *matCellDef="let laptop">
          {{ laptop.laptopsGranted }}
        </td>
      </ng-container>


      <div>
        <p><strong>Latest Purchase Date:</strong> {{ latestPurchaseDate }}</p>
      </div>


      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
