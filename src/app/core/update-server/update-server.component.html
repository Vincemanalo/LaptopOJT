<div class="modal" *ngIf="isEditModalOpen">
    <div class="modal-content">
      <span class="close-btn" (click)="closeModal()">×</span>
      <h2>
        {{ selectedServer.ServerName ? "Edit Server Details" : "Server Details" }}
      </h2>
  
      <form [formGroup]="editServerForm" (ngSubmit)="onSubmit()">
        <div class="form-grid">
        <mat-form-field>
          <mat-label>Server Name</mat-label>
          <input matInput formControlName="ServerName" placeholder="Enter Server Name" />
        </mat-form-field>
      
        <mat-form-field>
          <mat-label>Server Date</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="ServerDate" placeholder="MM/DD/YYYY" />
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
      
        <div class="button-group">
          <button class="btncncl" type="button" class="cancel-btn" (click)="closeModal()">Cancel</button>
          <button class="btnupdt" type="submit" [disabled]="editServerForm.invalid">Update</button>
        </div>
      </form>
    </div>
  </div>
